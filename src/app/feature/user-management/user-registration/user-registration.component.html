<div class="flex-col-fill">

  <!-- ── Form Body — each section is an accent-rail card (app-expansion-panel-header) ── -->
  <div class="scroll-area">
    <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">

      <!-- SECTION 1: Personal Information -->
      <app-expansion-panel-header
        [panelTitle]="'Personal Information'"
        [isOpenSignal]="isPersonalOpen">
        <div class="section-grid-3">
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'fullName'"
            [label]="'Full Name'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Full name is required', minlength: 'Minimum 3 characters' }">
          </input-text-box>
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'email'"
            [label]="'Email Address'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Email is required', email: 'Enter a valid email' }">
          </input-text-box>
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'phone'"
            [label]="'Phone Number'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Phone number is required' }">
          </input-text-box>
          <input-date
            [frmGroup]="registrationForm"
            [controlName]="'dateOfBirth'"
            [label]="'Date of Birth'"
            [dateFormat]="'YYYY-MM-DD'"
            displayMode="vertical">
          </input-date>
        </div>
      </app-expansion-panel-header>

      <!-- SECTION 2: Work Information -->
      <app-expansion-panel-header
        [panelTitle]="'Work Information'"
        [isOpenSignal]="isWorkOpen">
        <div class="section-grid-3">
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'employeeId'"
            [label]="'Employee ID'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Employee ID is required' }">
          </input-text-box>
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'designation'"
            [label]="'Designation'"
            displayMode="vertical">
          </input-text-box>
          <input-select-option-field
            [frmGroup]="registrationForm"
            [controlName]="'department'"
            [label]="'Department'"
            [options]="departmentOptions"
            [searchable]="true"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Department is required' }">
          </input-select-option-field>
          <input-select-option-field
            [frmGroup]="registrationForm"
            [controlName]="'branch'"
            [label]="'Branch'"
            [options]="branchOptions"
            [searchable]="true"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Branch is required' }">
          </input-select-option-field>
        </div>
      </app-expansion-panel-header>

      <!-- SECTION 3: System Access -->
      <app-expansion-panel-header
        [panelTitle]="'System Access & Credentials'"
        [isOpenSignal]="isAccessOpen">
        <div class="section-grid-3">
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'userId'"
            [label]="'Username / User ID'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'User ID is required' }">
          </input-text-box>
          <input-select-option-field
            [frmGroup]="registrationForm"
            [controlName]="'role'"
            [label]="'Role'"
            [options]="roleOptions"
            [searchable]="false"
            displayMode="vertical">
          </input-select-option-field>
          <input-select-option-field
            [frmGroup]="registrationForm"
            [controlName]="'status'"
            [label]="'Initial Status'"
            [options]="statusOptions"
            [searchable]="false"
            displayMode="vertical">
          </input-select-option-field>
          <input-text-box
            [frmGroup]="registrationForm"
            [controlName]="'password'"
            [label]="'Password'"
            displayMode="vertical"
            [customErrorMessages]="{ required: 'Password is required', minlength: 'Minimum 8 characters' }">
          </input-text-box>
          <div>
            <input-text-box
              [frmGroup]="registrationForm"
              [controlName]="'confirmPassword'"
              [label]="'Confirm Password'"
              displayMode="vertical"
              [customErrorMessages]="{ required: 'Please confirm password' }">
            </input-text-box>
            @if (passwordMismatch) {
              <p class="mt-1 text-xs text-red-500">Passwords do not match</p>
            }
          </div>
        </div>
      </app-expansion-panel-header>

    </form>
  </div>
