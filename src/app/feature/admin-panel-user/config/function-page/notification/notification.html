<div class="p-3">
  <div class="section-card notification-radios">

    <div class="grid grid-cols-12 gap-2 items-center mb-2">
      <label class="col-span-12 md:col-span-3 text-xs font-bold text-slate-700">Broadcast Type :</label>
      <div class="col-span-12 md:col-span-9 flex items-center gap-1.5">
        <input type="radio" id="rdbAllCustomer" name="broadcastTypeRadio"
               [checked]="broadcastType === 'ALL'"
               (change)="setBroadcastType()"
               class="cursor-pointer" />
        <label for="rdbAllCustomer" class="text-xs text-slate-700 cursor-pointer">All Customer</label>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-2 items-center mb-3">
      <label class="col-span-12 md:col-span-3 text-xs font-bold text-slate-700">Notification Type :</label>
      <div class="col-span-12 md:col-span-9 flex items-center gap-1.5">
        <input type="radio" id="rdbPush" name="notificationTypeRadio"
               [checked]="notificationType === 'PUSH'"
               (change)="setNotificationType()"
               class="cursor-pointer" />
        <label for="rdbPush" class="text-xs text-slate-700 cursor-pointer">Push Notification</label>
      </div>
    </div>

    <hr class="border-slate-200 my-2" />

    <div class="grid grid-cols-12 gap-2 items-start mb-2">
      <div class="col-span-12 md:col-span-3 pt-2">
        <label class="text-xs font-bold text-slate-700">Subject :</label>
      </div>
      <div class="col-span-12 md:col-span-9">
        <input-text-box
          [frmGroup]="msgForm"
          controlName="subject"
          label="Subject"
          placeholder="Enter subject">
        </input-text-box>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-2 items-start">
      <div class="col-span-12 md:col-span-3 pt-2">
        <label class="text-xs font-bold text-slate-700">Details :</label>
      </div>
      <div class="col-span-12 md:col-span-9">
        <input-text-area
          [frmGroup]="msgForm"
          controlName="details"
          label="Details"
          [rows]="4"
          placeholder="Enter notification details">
        </input-text-area>
      </div>
    </div>

  </div>
</div>
