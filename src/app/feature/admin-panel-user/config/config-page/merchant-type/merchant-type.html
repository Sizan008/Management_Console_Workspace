<div
  class="font-roboto w-full min-w-0 max-w-full overflow-x-hidden bg-slate-50 px-3 py-3 sm:px-4 lg:px-6"
>
  <div class="space-y-3">
    <section
      class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
    >
      <app-expansion-panel-header
        panelTitle="Merchant Type Entry"
        [isOpenSignal]="isMerchantInputOpen"
      >
      </app-expansion-panel-header>
      @if (isMerchantInputOpen()) {
        <div class="border-t border-slate-100 p-4">
          <form
            id="merchant-type-form"
            [formGroup]="merchantForm"
            class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(min(240px,100%),1fr))] gap-3"
          >
            <div class="min-w-0 max-w-md">
              <input-text-box
                class="w-full"
                [frmGroup]="merchantForm"
                controlName="merchantType"
                label="Merchant Type"
                displayMode="outline"
              >
              </input-text-box>
            </div>
          </form>
        </div>
      }
    </section>
    <section
      class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
    >
      <app-expansion-panel-header
        panelTitle="Merchant Type List"
        [isOpenSignal]="merchantPanel"
      >
      </app-expansion-panel-header>
      @if (merchantPanelGrid()) {
        <div class="border-t border-slate-100 p-3">
          <div class="min-w-0 overflow-x-auto">
            <div class="min-w-[600px]">
              <generic-data-grid
                id="merchantTypeGrid"
                [uniqueIdField]="'id'"
                [dataSource]="merchantTypeGrid()"
                [selectedColumns]="columns"
                [customColumnNames]="columnNames"
                [showEditButton]="true"
                [showDeleteButton]="true"
                [useInlineEdit]="false"
                [initPageSize]="5"
                [pageSizeOptions]="[5, 10, 20, 50]"
                [searchEnabled]="true"
                (onFHEditClick)="onEdit($event)"
                (onFHDeleteClick)="onDelete($event)"
              >
              </generic-data-grid>
            </div>
          </div>
        </div>
      }
    </section>
  </div>
  <app-action-confirmation-host></app-action-confirmation-host>
</div>
