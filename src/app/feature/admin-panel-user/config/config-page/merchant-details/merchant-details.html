<div
  class="font-roboto w-full min-w-0 max-w-full overflow-x-hidden bg-slate-50"
>
  <div class="min-w-0 space-y-3 p-3">
    <section
      class="min-w-0 overflow-hidden rounded-md border border-slate-200 bg-white shadow-sm"
    >
      <app-expansion-panel-header
        panelTitle="Merchant Details Management"
        [isOpenSignal]="merchantInformationPanelOpen"
      >
      </app-expansion-panel-header>
      @if (merchantInformationPanelOpen()) {
        <div class="border-t border-slate-100 p-4">
          <form
            id="merchant-details-form"
            [formGroup]="merchantForm"
            class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(min(240px,100%),1fr))] gap-4"
          >
            <div class="min-w-0">
              <input-select-option-field
                [frmGroup]="merchantForm"
                controlName="merchantType"
                label="Merchant Type"
                placeholder="Select Merchant Type"
                [options]="merchantTypeOptions()"
                displayMode="outline"
              >
              </input-select-option-field>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="merchantName"
                label="Merchant Name"
                placeholder="Enter Merchant Name"
                displayMode="outline"
                [maxLength]="150"
              >
              </input-text-box>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="discountAmount"
                label="Discount Amount"
                placeholder="Enter Discount Amount"
                displayMode="outline"
              >
              </input-text-box>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="description"
                label="Description"
                placeholder="Enter Description"
                displayMode="outline"
              >
              </input-text-box>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="mobileNumber"
                label="Mobile Number"
                placeholder="Enter Mobile Number"
                displayMode="outline"
              >
              </input-text-box>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="webUrl"
                label="Web URL"
                placeholder="Enter Web URL"
                displayMode="outline"
              >
              </input-text-box>
            </div>
            <div class="min-w-0">
              <input-text-box
                [frmGroup]="merchantForm"
                controlName="address"
                label="Address"
                placeholder="Enter Address"
                displayMode="outline"
              >
              </input-text-box>
            </div>
          </form>
          @if (!editingMerchant()) {
            <p class="mt-4 text-xs font-medium text-slate-500">
              Select Edit from Merchant Details List to update merchant
              information.
            </p>
          }
        </div>
      }
    </section>
    <section
      class="min-w-0 overflow-hidden rounded-md border border-slate-200 bg-white shadow-sm"
    >
      <app-expansion-panel-header
        panelTitle="Merchant Details List"
        [isOpenSignal]="merchantListPanelOpen"
      >
      </app-expansion-panel-header>
      @if (merchantListPanelOpen()) {
        <div class="min-w-0 overflow-x-auto border-t border-slate-100 p-3">
          <div class="min-w-[700px]">
            <generic-data-grid
              id="merchant-details-grid"
              [dataSource]="merchantGridRows()"
              [selectedColumns]="merchantGridColumns"
              [customColumnNames]="merchantGridColumnNames"
              [initPageSize]="10"
              [pageSizeOptions]="[5, 10, 20, 50]"
              [showPaginator]="true"
              [searchEnabled]="true"
              [enableSelection]="false"
              [useInlineEdit]="false"
              [showCustomAction1]="true"
              [customActionSvg1]="editActionSvg"
              [customActionTooltip1]="'Edit Merchant'"
              [showCustomAction2]="true"
              [customActionSvg2]="deleteActionSvg"
              [customActionTooltip2]="'Delete Merchant'"
              uniqueIdField="benefitId"
              (onExtraAction1Click)="editMerchant($event)"
              (onExtraAction2Click)="deleteMerchant($event)"
            >
            </generic-data-grid>
          </div>
        </div>
      }
    </section>
  </div>
  <app-action-confirmation-host></app-action-confirmation-host>
</div>
