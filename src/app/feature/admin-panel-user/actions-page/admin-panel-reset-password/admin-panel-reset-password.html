<section
  class="flex min-w-0 flex-col bg-white"
  aria-label="Reset User Password"
  [attr.aria-busy]="busy()"
>
  <div class="space-y-4 p-3 sm:p-5">
    @if (loading()) {
      <p
        role="status"
        class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600"
      >
        Loading user information…
      </p>
    }
    @if (errorMessage()) {
      <p
        role="alert"
        class="break-words rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
      >
        {{ errorMessage() }}
      </p>
    }
    @if (successMessage()) {
      <p
        role="status"
        class="break-words rounded-lg border border-green-200 bg-green-50 p-3 text-sm text-green-800"
      >
        {{ successMessage() }}
      </p>
    }

    @if (user()) {
      <div class="min-w-0 space-y-3">
        <app-expansion-panel-header
          panelTitle="User Information"
          [isOpenSignal]="informationOpen"
        />
        @if (informationOpen()) {
          <case-summary-details
            title="Selected User Details"
            [details]="userDetails()"
          />
        }
      </div>
    }
  </div>

  <div
    class="sticky bottom-0 z-10 flex flex-wrap items-center justify-end gap-2 border-t border-slate-100 bg-slate-50 p-3 sm:px-5"
  >
    <generic-button label="Close" [enable]="!saving()" (onClick)="onClose()" />
    <generic-button
      label="Refresh"
      [enable]="!busy() && !!selectedUserId()"
      (onClick)="refreshUser()"
    />
    <generic-button
      [label]="saving() ? 'Submitting…' : 'Reset Password'"
      [enable]="canReset()"
      (onClick)="requestReset()"
    />
  </div>
</section>

<confirmation-dialogue
  [isOpen]="confirmationOpen()"
  [config]="confirmationConfig"
  (buttonClick)="onConfirmationButtonClick($event)"
  (close)="confirmationOpen.set(false)"
/>
