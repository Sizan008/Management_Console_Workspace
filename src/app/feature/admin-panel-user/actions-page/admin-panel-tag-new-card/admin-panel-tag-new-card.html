<div
  class="flex h-full min-h-0 w-full min-w-0 max-w-full flex-col overflow-hidden bg-slate-50 font-roboto"
>
  <div class="min-h-0 min-w-0 flex-1 overflow-y-auto overflow-x-hidden">
    <div class="min-w-0 space-y-3 p-3">
      <section
        class="min-w-0 overflow-hidden rounded-lg border border-slate-200 bg-white"
      >
        <app-expansion-panel-header
          [panelTitle]="'Customer Information'"
          [isOpenSignal]="customerPanelOpen"
        >
        </app-expansion-panel-header>
        @if (customerPanelOpen()) {
          <div class="border-t border-slate-100 p-3">
            <form
              [formGroup]="customerForm"
              class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(min(210px,100%),1fr))] gap-3"
            >
              <div class="min-w-0">
                <input-text-box
                  [frmGroup]="customerForm"
                  controlName="userId"
                  label="User ID"
                  [isReadonly]="true"
                  displayMode="outline"
                >
                </input-text-box>
              </div>
              <div class="min-w-0">
                <input-text-box
                  [frmGroup]="customerForm"
                  controlName="customerId"
                  label="Customer ID"
                  [isReadonly]="true"
                  displayMode="outline"
                >
                </input-text-box>
              </div>
              <div class="min-w-0">
                <input-text-box
                  [frmGroup]="customerForm"
                  controlName="customerName"
                  label="Customer Name"
                  [isReadonly]="true"
                  displayMode="outline"
                >
                </input-text-box>
              </div>
            </form>
          </div>
        }
      </section>

      <div class="flex min-w-0 flex-wrap items-center gap-2">
        <generic-button
          label="New Card Tag"
          [styles]="getTabButtonStyle('NEW_CARD')"
          [enable]="!loading()"
          (onClick)="changeCardType('NEW_CARD')"
        >
        </generic-button>

        <generic-button
          label="Bangla QR Card Tag"
          [styles]="getTabButtonStyle('BANGLA_QR')"
          [enable]="!loading()"
          (onClick)="changeCardType('BANGLA_QR')"
        >
        </generic-button>

        <div class="ml-auto flex flex-wrap items-center justify-end gap-2">
          <generic-button
            [label]="isNewCardTab() ? 'Tag Card' : 'Register Card'"
            [enable]="!loading() && !!customer()"
            (onClick)="requestSave()"
          >
          </generic-button>
        </div>
      </div>

      <section
        class="min-w-0 overflow-hidden rounded-lg border border-slate-200 bg-white"
      >
        <app-expansion-panel-header
          [panelTitle]="activeCardEntryTitle()"
          [isOpenSignal]="cardInformationPanelOpen"
        >
        </app-expansion-panel-header>

        @if (cardInformationPanelOpen()) {
          <div class="min-w-0 border-t border-slate-100 p-3">
            @if (isNewCardTab()) {
              <form
                [formGroup]="newCardForm"
                class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(min(230px,100%),1fr))] gap-3"
              >
                <div class="min-w-0">
                  <input-number
                    [frmGroup]="newCardForm"
                    controlName="cardNumber"
                    label="Card Number"
                    placeholder="Enter 16 digit Card Number"
                    displayMode="outline"
                    [minLen]="16"
                    [maxLen]="16"
                    [allowLeadingZeros]="true"
                    [tooltip]="''"
                    [customErrorMessages]="{
                      required: 'Card Number is required.',
                      cardNumberLengthInvalid:
                        'Card Number must contain exactly 16 digits.',
                    }"
                  >
                  </input-number>
                </div>
              </form>
            }

            @if (isBanglaQrTab()) {
              <form
                [formGroup]="banglaQrCardForm"
                class="grid min-w-0 grid-cols-[repeat(auto-fit,minmax(min(220px,100%),1fr))] gap-3"
              >
                <div class="min-w-0">
                  <input-number
                    [frmGroup]="banglaQrCardForm"
                    controlName="cardNumber"
                    label="Card Number"
                    placeholder="Enter 16 digit Card Number"
                    displayMode="outline"
                    [minLen]="16"
                    [maxLen]="16"
                    [allowLeadingZeros]="true"
                    [tooltip]="''"
                    [customErrorMessages]="{
                      required: 'Card Number is required.',
                      cardNumberLengthInvalid:
                        'Card Number must contain exactly 16 digits.',
                    }"
                  >
                  </input-number>
                </div>

                <div class="min-w-0">
                  <input-number
                    [frmGroup]="banglaQrCardForm"
                    controlName="mobileNumber"
                    label="Mobile Number"
                    placeholder="Enter Mobile Number"
                    displayMode="outline"
                    [minLen]="11"
                    [maxLen]="15"
                    [allowLeadingZeros]="true"
                    [tooltip]="''"
                    [customErrorMessages]="{
                      required: 'Mobile Number is required.',
                      mobileNumberLengthInvalid:
                        'Mobile Number must contain 11 to 15 digits.',
                    }"
                  >
                  </input-number>
                </div>

                <div class="min-w-0">
                  <input-text-box
                    [frmGroup]="banglaQrCardForm"
                    controlName="emailAddress"
                    label="Email Address"
                    placeholder="Enter Email Address"
                    displayMode="outline"
                    [maxLength]="150"
                  >
                  </input-text-box>
                </div>

                <div class="min-w-0">
                  <input-number
                    [frmGroup]="banglaQrCardForm"
                    controlName="expiryMmyy"
                    label="Expiry Date (MMYY)"
                    placeholder="MMYY"
                    displayMode="outline"
                    [minLen]="4"
                    [maxLen]="4"
                    [allowLeadingZeros]="true"
                    [tooltip]="''"
                    [customErrorMessages]="{
                      required: 'Expiry Date is required.',
                      expiryMmyyInvalid:
                        'Use valid MMYY format. Example: 0129.',
                    }"
                  >
                  </input-number>
                </div>
              </form>
            }
          </div>
        }
      </section>

      <section
        class="min-w-0 overflow-hidden rounded-lg border border-slate-200 bg-white"
      >
        <app-expansion-panel-header
          [panelTitle]="activeCardListTitle()"
          [isOpenSignal]="cardListPanelOpen"
        >
        </app-expansion-panel-header>

        @if (cardListPanelOpen()) {
          <div class="min-w-0 overflow-x-auto border-t border-slate-100 p-3">
            @if (loading()) {
              <div
                class="flex min-h-[100px] items-center justify-center text-sm text-slate-500"
              >
                Loading card information...
              </div>
            }

            <div class="min-w-[500px]">
              <generic-data-grid
                id="admin-tag-new-card-grid"
                [dataSource]="taggedCards()"
                [selectedColumns]="activeGridColumns()"
                [customColumnNames]="activeGridColumnNames()"
                [initPageSize]="5"
                [pageSizeOptions]="[5, 12, 20]"
                [showPaginator]="true"
                [useInlineEdit]="false"
                [showCustomAction1]="isNewCardTab()"
                [customActionSvg1]="untagActionSvg"
                [customActionTooltip1]="'UnTag Card'"
                (onExtraAction1Click)="openUntagConfirmation($event)"
              >
              </generic-data-grid>
            </div>
          </div>
        }
      </section>
    </div>
  </div>

  <div
    class="z-20 flex w-full shrink-0 items-center justify-end gap-2 border-t border-slate-200 bg-white px-4 py-3 shadow-[0_-2px_8px_rgba(15,23,42,0.06)]"
  >
    <generic-button
      id="tag-new-card-reset-button"
      label="Reset"
      [enable]="!loading() && hasActiveFormValue"
      (onClick)="requestReset()"
    >
    </generic-button>

    <generic-button
      id="tag-new-card-close-button"
      label="Close"
      [enable]="!loading()"
      (onClick)="requestClose()"
    >
    </generic-button>
  </div>

  <app-action-confirmation-host></app-action-confirmation-host>
</div>
