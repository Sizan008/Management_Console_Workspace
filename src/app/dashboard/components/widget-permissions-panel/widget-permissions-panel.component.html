<div *ngIf="widget()" class="bg-white rounded-lg shadow p-6">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-semibold text-slate-800">
      Roles: {{ widget()!.name }}
    </h3>
    <button (click)="close()" class="text-slate-500 hover:text-slate-700 text-xl">&#x2715;</button>
  </div>

  <div *ngIf="widget()!.permittedRoles && widget()!.permittedRoles!.length > 0" class="space-y-2">
    <p class="text-sm font-semibold text-slate-700 mb-2">Permitted Roles</p>
    <div *ngFor="let role of widget()!.permittedRoles"
         class="inline-flex items-center px-3 py-1 mr-2 mb-2 rounded-full bg-blue-100 text-blue-800 text-sm font-medium">
      {{ role }}
    </div>
  </div>

  <div *ngIf="!widget()!.permittedRoles || widget()!.permittedRoles!.length === 0"
       class="text-sm text-slate-500 italic p-4 bg-slate-50 rounded text-center">
    No roles assigned — widget is hidden from all users.
  </div>
</div>
