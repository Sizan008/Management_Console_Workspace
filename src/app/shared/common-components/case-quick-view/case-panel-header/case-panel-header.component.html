<div class="flex items-center justify-between p-2 sm:p-x-1 border-b border-gray-100 flex-shrink-0">
  <div>
    <h2 class="text-base sm:text-lg font-bold text-slate-800">{{ title }}</h2>
    <p *ngIf="subtitle" class="text-xs sm:text-sm font-bold text-blue-600 mt-0.5 truncate">{{ subtitle }}</p>
  </div>

  <div class="flex items-center gap-1">
    <!-- Fullscreen toggle -->
    <button type="button"
            (click)="workspaceState.toggle()"
            [title]="workspaceState.isFullscreen() ? 'Exit fullscreen' : 'Open fullscreen'"
            class="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
      <svg *ngIf="!workspaceState.isFullscreen()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
      </svg>
      <svg *ngIf="workspaceState.isFullscreen()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
      </svg>
    </button>
    <!-- Close -->
    <button *ngIf="actionVisible"
            type="button"
            (click)="action.emit()"
            class="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors"
            [attr.aria-label]="actionAriaLabel">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
