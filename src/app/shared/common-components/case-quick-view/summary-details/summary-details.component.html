<div class="bg-slate-50 border border-slate-100 rounded-lg p-4 space-y-4">
  <div class="summary-card-header">
    <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">{{ title }}</h3>
    <button *ngIf="actionText" (click)="action.emit()" type="button"
            class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-colors">
      {{ actionText }}
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-4">
    <div *ngFor="let item of details" class="min-w-0">
      <span class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider">{{ item.label }}</span>
      <span class="block text-xs font-bold text-slate-700 mt-1 truncate break-words" [title]="item.value">{{ item.value }}</span>
    </div>
  </div>
</div>
