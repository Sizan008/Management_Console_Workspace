<div class="border-b border-gray-200">
  <nav
    role="tablist"
    class="flex flex-wrap -mb-px"
  >
    <button
      *ngFor="let tab of tabs"
      role="tab"
      type="button"
      [attr.aria-selected]="activeTab === tab"
      (click)="selectTab(tab)"
      [ngClass]="activeTab === tab
        ? 'border-blue-600 text-blue-600 font-medium'
        : 'border-transparent text-slate-500 font-normal hover:text-slate-700 hover:border-slate-300'"
      class="w-full sm:w-auto px-4 py-2.5 text-sm border-b-2 transition-colors duration-150 focus:outline-none"
    >
      {{ tab }}
    </button>
  </nav>
</div>
